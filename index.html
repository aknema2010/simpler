<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A beautiful meditation timer with healing sounds, binaural beats, and nature ambience">
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meditation Timer">
  
  <title>Meditation Timer</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Loading spinner */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: white;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Load-failure fallback: if the app hasn't mounted shortly after load,
       replace the spinner with an actionable message instead of spinning
       forever (e.g. offline, blocked CDN, or a script error). -->
  <script>
    window.addEventListener('error', function (e) {
      var root = document.getElementById('root');
      if (root && root.querySelector('.loading')) {
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;' +
          'justify-content:center;padding:24px;text-align:center;color:#e8e8f0;' +
          'font-family:sans-serif"><div><h2 style="font-weight:600">' +
          'Could not load the app</h2><p style="color:#8a8aa0;margin-top:8px">' +
          (e && e.message ? e.message : 'A script failed to load.') +
          '</p><p style="color:#8a8aa0;margin-top:8px">Check your connection ' +
          'and reload.</p></div></div>';
      }
    });
    window.addEventListener('load', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.querySelector('.loading')) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;' +
            'justify-content:center;padding:24px;text-align:center;color:#e8e8f0;' +
            'font-family:sans-serif"><div><h2 style="font-weight:600">' +
            'Still loading…</h2><p style="color:#8a8aa0;margin-top:8px">The app ' +
            'did not start. If you opened this file directly, serve it over ' +
            'http instead, or check your connection and reload.</p></div></div>';
        }
      }, 8000);
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => console.log('SW registered:', registration))
          .catch(error => console.log('SW registration failed:', error));
      });
    }
  </script>
  
  <!-- App (pre-compiled plain JS; no runtime Babel needed) -->
  <script src="./app.js"></script>
</body>
</html>
